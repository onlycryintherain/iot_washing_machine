services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundry
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://laundry:${POSTGRES_PASSWORD}@db:5432/laundry
      ENABLE_SCHEDULER: "true"
    # Only the local Cloudflare Tunnel connector needs to reach the app.
    ports:
      - "127.0.0.1:3000:3000"

  # Optional public HTTPS entry. Enable with COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in .env.
  # The tunnel's public hostname must point to http://app:3000 (set in the Cloudflare Zero Trust dashboard).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: laundry
      PGDATABASE: laundry
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # One compressed dump per day, keeping the last 7 days.
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/laundry-$$(date +%F).dump && find /backups -name 'laundry-*.dump' -mtime +7 -delete; sleep 86400; done"]

volumes:
  db-data:
