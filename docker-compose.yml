services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laundry
      POSTGRES_USER: laundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laundry -d laundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://laundry:${POSTGRES_PASSWORD}@db:5432/laundry
      ENABLE_SCHEDULER: "true"
    # Loopback only by default. Set APP_BIND to the server's LAN IP when the Cloudflare Tunnel
    # connectors run in other network namespaces (e.g. k3s pods) and reach the app by that IP.
    ports:
      - "${APP_BIND:-127.0.0.1}:3000:3000"

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: laundry
      PGDATABASE: laundry
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # One compressed dump per day, keeping the last 7 days.
    entrypoint: ["sh", "-c", "while true; do pg_dump -Fc -f /backups/laundry-$$(date +%F).dump && find /backups -name 'laundry-*.dump' -mtime +7 -delete; sleep 86400; done"]

volumes:
  db-data:
