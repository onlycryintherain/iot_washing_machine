<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="t d">
  <title id="t">모형 세탁기 외관</title>
  <desc id="d">3D 프린트로 만드는 모형 세탁기의 정면도, 측면 단면도, 시연 배치도. 상단 패널에 LCD, 남은 시간 표시창, LED, 버튼, 부저 구멍이 있고 카메라는 세탁기 옆 기둥에서 패널을 내려다본다.</desc>
  <defs><style>
    text{font-family:'Malgun Gothic','Segoe UI',sans-serif;fill:#17251f}
    .title{font-size:30px;font-weight:750}.sub{font-size:16px;fill:#53655a}.h{font-size:19px;font-weight:700}
    .t{font-size:15px}.n{font-size:13.5px;fill:#526258}.dim{font-size:13px;fill:#7a4fb5}
    .body{fill:#f4f7f5;stroke:#6b7c72;stroke-width:3}.panel{fill:#2c3a34;stroke:#1d2924;stroke-width:3}
    .win{fill:#0e1512;stroke:#8fa398;stroke-width:2}.lcd{fill:#b8d8a8;stroke:#4d6b43;stroke-width:2}
    .seg{fill:#ff4b3a;font-family:monospace;font-size:26px;font-weight:700}
    .door{fill:#dfe9f2;stroke:#6b7c72;stroke-width:4}.drum{fill:#aebfce;stroke:#6b7c72;stroke-width:3}
    .led{stroke:#1d2924;stroke-width:2}.btn{fill:#ffd24a;stroke:#8a6a00;stroke-width:2}
    .hole{fill:#0e1512}.inner{fill:#fff;stroke:#b5c8b9;stroke-width:2}.pcb{fill:#cfe8d6;stroke:#3c7959;stroke-width:2}
    .plate{fill:#e9f0fa;stroke:#3e649c;stroke-width:2.5}.cam{fill:#e9f0fa;stroke:#3e649c;stroke-width:3}
    .line{fill:none;stroke:#7a4fb5;stroke-width:2;stroke-dasharray:7 6}.lead{fill:none;stroke:#526258;stroke-width:1.5}
  </style></defs>
  <rect width="1400" height="1010" fill="#fbfdfb"/>
  <text x="40" y="46" class="title">모형 세탁기 외관 (3D 프린트)</text>
  <text x="40" y="72" class="sub">기존 세탁기에 붙이는 센서 키트를 시연하기 위한 모형  ·  본체 170 x 190 x 150mm (조정 가능)  ·  PLA 출력, 문 유리창은 투명 PLA나 아세테이트</text>
  <text x="40" y="106" class="h">정면도</text>
  <rect class="body" x="40" y="120" width="510" height="570" rx="14"/>
  <rect class="panel" x="40" y="120" width="510" height="210" rx="14"/>
  <rect class="panel" x="40" y="150" width="510" height="180"/>
  <rect class="win" x="59" y="139" width="250" height="118" rx="6"/>
  <rect class="lcd" x="64" y="144" width="240" height="108" rx="3"/>
  <text x="76" y="180" style="font-family:monospace;font-size:20px;fill:#2f4a29">1번 세탁기 세탁중</text>
  <text x="76" y="216" style="font-family:monospace;font-size:20px;fill:#2f4a29">탈수 중 12분 남음</text>
  <rect class="win" x="335" y="139" width="145" height="76" rx="6"/>
  <rect x="340" y="144" width="135" height="66" rx="3" fill="#190b0b"/>
  <text x="354" y="190" class="seg">0:12</text>
  <circle class="led" cx="88" cy="302" r="9" fill="#e5484d"/>
  <circle class="led" cx="154" cy="302" r="9" fill="#f5b301"/>
  <circle class="led" cx="220" cy="302" r="9" fill="#2db36b"/>
  <circle class="btn" cx="340" cy="302" r="14"/>
  <circle class="hole" cx="430" cy="292" r="4"/>
  <circle class="hole" cx="448" cy="292" r="4"/>
  <circle class="hole" cx="466" cy="292" r="4"/>
  <circle class="hole" cx="430" cy="310" r="4"/>
  <circle class="hole" cx="448" cy="310" r="4"/>
  <circle class="hole" cx="466" cy="310" r="4"/>
  <circle class="door" cx="295.0" cy="510.0" r="150"/>
  <circle class="drum" cx="295.0" cy="510.0" r="120"/>
  <circle cx="295.0" cy="510.0" r="66" fill="#93a6b6" opacity="0.6"/>
  <rect x="421.0" y="504.0" width="12" height="12" rx="3" fill="#6b7c72"/>
  <text x="225.0" y="514.0" class="n" style="fill:#fff">문(장식)</text>
  <rect x="54" y="690" width="16" height="8" rx="2" fill="#6b7c72"/>
  <rect x="520" y="690" width="16" height="8" rx="2" fill="#6b7c72"/>
  <text x="40" y="724" class="n">치수는 부품 크기 기준: LCD 창 80x36mm, 표시창 45x22mm, LED 지름 5mm 3개, 버튼 12x12mm</text>
  <text x="640" y="106" class="h">측면 단면도 (내부 배치)</text>
  <rect class="body" x="640" y="120" width="450" height="570" rx="14"/>
  <rect class="panel" x="640" y="120" width="450" height="210" rx="14"/>
  <text x="656" y="150" class="t" style="fill:#fff">상단 패널 (LCD, 표시창, LED, 버튼, 부저)</text>
  <text x="970" y="425.0" class="n" style="fill:#fff" transform="rotate(0)"></text>
  <rect class="inner" x="650" y="340" width="430" height="340" rx="8"/>
  <rect class="plate" x="670" y="642" width="240" height="14" rx="3"/>
  <circle cx="730" cy="630" r="12" fill="#ffd24a" stroke="#8a6a00" stroke-width="2"/>
  <rect x="790" y="624" width="40" height="18" rx="3" fill="#2d6cdf"/>
  <rect class="pcb" x="940" y="360" width="110" height="120" rx="4"/>
  <text x="948" y="382" class="n">ESP32 DevKitC</text>
  <rect class="pcb" x="940" y="490" width="110" height="66" rx="4"/>
  <text x="948" y="510" class="n">만능기판</text>
  <text x="948" y="526" class="n">(2N2222A 등)</text>
  <text x="656" y="724" class="n">뒷면에 USB 케이블 구멍, 5V 충전기에 연결. 카메라는 본체와 따로 놓음</text>
  <text x="656" y="744" class="n">바닥판 아래는 진동이 퍼지지 않게 고무발 4개</text>
  <path class="line" d="M40 116 H550"/><text x="265.0" y="112" class="dim">170mm</text>
  <text x="40" y="800" class="h">시연 배치도 (위에서 본 모습, 비율 무시)</text>
  <rect class="body" x="60" y="830" width="150" height="130" rx="10"/><rect class="panel" x="60" y="830" width="150" height="44" rx="10"/>
  <text x="80" y="858" class="t" style="fill:#fff">패널</text>
  <text x="70" y="920" class="t">모형 세탁기</text>
  <rect class="cam" x="760" y="860" width="130" height="64" rx="10"/><text x="775" y="888" class="t">ESP32-CAM</text><text x="775" y="910" class="n">받침 기둥(3D)</text>
  <path class="line" d="M760 892 L210 852"/><path class="line" d="M760 892 L210 880"/>
  <text x="400" y="915" class="dim">40~60cm, 표시창을 위에서 20~35도로 내려다봄</text>
  <text x="400" y="938" class="n">사용자는 패널을 가리는 것 없이 그대로 볼 수 있음</text>
  <text x="920" y="870" class="n">앱 화면(폰 또는 태블릿)이 현황판 역할</text>
  <rect x="920" y="885" width="70" height="110" rx="10" fill="#fff" stroke="#6b7c72" stroke-width="3"/><text x="932" y="940" class="n">앱</text>
  <text x="1130" y="130" class="h">구성</text>
  <text x="1130" y="156" class="t">상단 패널: LCD(상태</text>
  <text x="1130" y="176" class="t">문구), 남은 시간</text>
  <text x="1130" y="196" class="t">표시창(카메라가 읽음)</text>
  <text x="1130" y="226" class="t">LED 3개: 빨강=세탁 중,</text>
  <text x="1130" y="246" class="t">노랑=대기, 초록=사용 가능</text>
  <text x="1130" y="276" class="t">버튼: 수거 확인</text>
  <text x="1130" y="306" class="t">소리 구멍: 부저(또는 스피커)</text>
  <text x="1130" y="326" class="t">위치</text>
  <text x="1130" y="356" class="t">문: 장식용, 원 모양 홈과</text>
  <text x="1130" y="376" class="t">투명 창</text>
  <text x="1130" y="406" class="t">내부: 바닥판 위 진동 모터와</text>
  <text x="1130" y="426" class="t">MPU6050, 뒤쪽 벽에</text>
  <text x="1130" y="446" class="t">ESP32와 만능기판</text>
  <text x="696" y="676" class="t">진동 모터</text>
  <text x="788" y="676" class="t">MPU6050</text>
  <text x="662" y="540" class="n">모터와 센서를 같은 바닥판에 단단히 고정해</text>
  <text x="662" y="560" class="n">진동이 센서로 잘 전달되게 함</text>
</svg>