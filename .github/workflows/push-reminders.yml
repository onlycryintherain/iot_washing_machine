name: Send laundry notifications

# Manual only. A recurring schedule keeps the Neon compute awake around the clock and
# exhausts the free-plan CU-hours; run this (or the simulator's "대기 중인 알림 처리"
# button) when a pickup reminder needs to be sent.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process completed washes and pickup reminders
        env:
          DEVICE_API_SECRET: ${{ secrets.DEVICE_API_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$DEVICE_API_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $DEVICE_API_SECRET" \
            "${APP_URL:-https://iotwashingmachine.vercel.app}/api/internal/process-reminders"
