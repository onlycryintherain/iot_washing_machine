name: Send laundry notifications

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process completed washes and pickup reminders
        env:
          DEVICE_API_SECRET: ${{ secrets.DEVICE_API_SECRET }}
        run: |
          test -n "$DEVICE_API_SECRET"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $DEVICE_API_SECRET" \
            https://iotwashingmachine.vercel.app/api/internal/process-reminders
